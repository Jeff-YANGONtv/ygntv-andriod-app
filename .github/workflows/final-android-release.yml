name: Final Android release APK

on:
  push:
    branches:
      - feat/mobile-lucky-draw-continue-watching-notifications
    paths:
      - .github/workflows/final-android-release.yml

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout approved app source commit
        uses: actions/checkout@v4
        with:
          ref: 88afa610f67aae8e1b33e87f34d8748f3383ab6f
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Set up configured Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve dependencies and run tests
        continue-on-error: true
        run: |
          flutter --version
          flutter pub get
          flutter test

      - name: Generate the ignored Gradle wrapper files for this runner
        working-directory: android
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          flutter_sdk="$(dirname "$(dirname "$flutter_bin")")"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_sdk" "$sdk" > local.properties
          gradle wrapper --gradle-version 9.3.1

      - name: Align Gradle output directory in the runner checkout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle.kts")
          text = path.read_text()
          old = '.dir("../../build")'
          if text.count(old) != 1:
              raise SystemExit("unexpected Android root build-directory config")
          path.write_text(text.replace(old, '.dir("../build")', 1))
          PY

      - name: Stage encrypted release signing inputs and configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_PROPERTIES"
          printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/ygntv-customer-release.p12
          chmod 600 android/key.properties android/app/ygntv-customer-release.p12
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          qa_flavor = (
              '    flavorDimensions += "deployment"\n'
              "    productFlavors {\n"
              '        create("qa") {\n'
              '            dimension = "deployment"\n'
              '            applicationIdSuffix = ".test"\n'
              '            versionNameSuffix = "-TEST"\n'
              '            manifestPlaceholders["appLabel"] = "YGNTV(unofficial)"\n'
              "        }\n"
              "    }\n\n"
          )
          if text.count(qa_flavor) != 1:
              raise SystemExit("expected the QA-only flavor block exactly once")
          text = text.replace(qa_flavor, "", 1)
          plugins_anchor = "plugins {\n"
          if text.count(plugins_anchor) != 1:
              raise SystemExit("unexpected Gradle plugins block")
          text = text.replace(plugins_anchor, "import java.util.Properties\n\nplugins {\n", 1)
          plugin_anchor = "}\n\nandroid {\n"
          plugin_replacement = (
              "}\n\n"
              "val signingProperties = Properties().apply {\n"
              "    val signingPropertiesFile = rootProject.file(\"key.properties\")\n"
              "    if (signingPropertiesFile.exists()) {\n"
              "        signingPropertiesFile.inputStream().use(::load)\n"
              "    }\n"
              "}\n\n"
              "android {\n"
          )
          if text.count(plugin_anchor) != 1:
              raise SystemExit("unexpected Gradle plugin/config structure")
          text = text.replace(plugin_anchor, plugin_replacement, 1)

          old_release = (
              "    buildTypes {\n"
              "        release {\n"
              "            // TODO: Add your own signing config for the release build.\n"
              "            // Signing with the debug keys for now, so `flutter run --release` works.\n"
              "            signingConfig = signingConfigs.getByName(\"debug\")\n"
          )
          new_release = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            keyAlias = signingProperties.getProperty(\"keyAlias\", \"\")\n"
              "            keyPassword = signingProperties.getProperty(\"keyPassword\", \"\")\n"
              "            storeFile = signingProperties.getProperty(\"storeFile\")?.let { rootProject.file(it) }\n"
              "            storePassword = signingProperties.getProperty(\"storePassword\", \"\")\n"
              "            storeType = signingProperties.getProperty(\"storeType\", \"PKCS12\")\n"
              "        }\n"
              "    }\n\n"
              "    buildTypes {\n"
              "        release {\n"
              "            signingConfig = signingConfigs.getByName(\"release\")\n"
          )
          if text.count(old_release) != 1:
              raise SystemExit("expected debug-signed release block not found exactly once")
          path.write_text(text.replace(old_release, new_release, 1))
          PY

      - name: Build and verify the production-package APK
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"
          expected_cert='c0f2e11564b645990de5224ac6c56baba74385869109e610c66cc49783f89969'

          set +e
          flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg=force-version-code-ignoring-abi=true
          flutter_status=$?
          set -e

          while IFS= read -r candidate; do
            printf 'APK candidate: %s\n' "$candidate"
            "$apksigner" verify --verbose --print-certs "$candidate" || true
            "$aapt" dump badging "$candidate" 2>/dev/null | sed -n '1p' || true
            candidate_abis="$(unzip -Z1 "$candidate" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd, -)"
            printf 'Candidate ABIs: %s\n' "$candidate_abis"
          done < <(find .. -type f -name '*.apk' -size +0c -print | sort)

          apk=''
          while IFS= read -r candidate; do
            cert_output="$("$apksigner" verify --verbose --print-certs "$candidate" 2>/dev/null)" || continue
            printf '%s\n' "$cert_output" | grep -Fq "Signer #1 certificate SHA-256 digest: $expected_cert" || continue
            badging="$("$aapt" dump badging "$candidate" 2>/dev/null)" || continue
            printf '%s\n' "$badging" | grep -Fq "package: name='org.ygntv.ygntv_customer'" || continue
            printf '%s\n' "$badging" | grep -Fq "versionCode='6023'" || continue
            printf '%s\n' "$badging" | grep -Fq "versionName='1.1.8'" || continue
            candidate_abis="$(unzip -Z1 "$candidate" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd, -)"
            test "$candidate_abis" = 'arm64-v8a' || continue
            apk="$candidate"
            break
          done < <(find .. -type f -name '*.apk' -size +0c -print | sort)

          if [ -z "$apk" ]; then
            printf 'No APK matched the historical release signer, package/version, and arm64 ABI.\n'
            find .. -type f -name '*.apk' -printf '%p (%s bytes)\n' || true
            exit 1
          fi
          if [ "$flutter_status" -ne 0 ]; then
            printf 'Flutter returned %s, but a fully verified release APK was found at %s\n' "$flutter_status" "$apk"
          fi
          cert_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$cert_output" | grep -F "Signer #1 certificate SHA-256 digest: $expected_cert"
          badging="$("$aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='org.ygntv.ygntv_customer'"
          printf '%s\n' "$badging" | grep -F "versionCode='6023'"
          printf '%s\n' "$badging" | grep -F "versionName='1.1.8'"
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u | paste -sd, -)"
          printf 'APK path: %s\nABI: %s\n' "$apk" "$abis"
          printf 'APK size (bytes): %s\n' "$(stat -c '%s' "$apk")"
          sha256sum "$apk"
          mkdir -p build/final-artifacts
          cp "$apk" build/final-artifacts/app-arm64-v8a-release.apk

      - name: Retain the final APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ygntv-customer-final-release-arm64
          path: build/final-artifacts/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove staged signing files
        if: always()
        run: rm -f android/key.properties android/app/ygntv-customer-release.p12
